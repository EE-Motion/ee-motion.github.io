server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Like GitHub Pages: no access to dotfiles (.git) or to the local tooling.
    location ~ /\.                         { deny all; }
    location ~ ^/(docker|docker-compose\.yml) { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}

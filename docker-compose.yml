# Local preview of the GitHub Pages site: docker compose up -d, then open http://localhost:8090
services:
  web:
    image: nginx:1.27-alpine
    container_name: ee-motion-page
    ports:
      - "${PORT:-8090}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
